<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="src/assets/favicon-32x32.png" />
    <title>Cybersecurity for Everyday Workers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/styles/components.css" />
  </head>
  <body class="dark-palette">
    <a href="#main-content" class="skip-link">Skip to content</a>
    <header class="site-header">
      <a href="./" class="brand">
        <span class="prompt">$</span>cybersecurity-for-workers
      </a>
      <nav class="header-nav">
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme"></button>
        <button type="button" class="header-link" id="reset-progress">reset progress</button>
      </nav>
    </header>

    <main class="page" id="main-content">
      <section class="page-intro">
        <h1>Cybersecurity for Everyday Workers</h1>
        <p class="subtitle">
          Ten modules. Sixty short lessons. Open one, finish it, mark it done.
        </p>
      </section>
      <div class="course-progress" id="course-progress"></div>
      <div class="continue-bar" id="continue-bar"></div>
<ol class="module-list" id="module-list" aria-label="Course modules"></ol>
    </main>

    <script>
      (function () {
        var btn = document.getElementById('theme-toggle');
        var SUN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
        var MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
        var saved = localStorage.getItem('fcc-theme') || 'dark';
        function apply(t) {
          document.body.className = t === 'light' ? 'light-palette' : 'dark-palette';
          btn.innerHTML = t === 'light' ? MOON : SUN;
          btn.setAttribute('aria-label', 'Switch to ' + (t === 'light' ? 'dark' : 'light') + ' theme');
          localStorage.setItem('fcc-theme', t);
        }
        apply(saved);
        btn.addEventListener('click', function () {
          apply(document.body.classList.contains('light-palette') ? 'dark' : 'light');
        });
      })();
    </script>
    <script type="module" src="src/features/home/index.js"></script>
  </body>
</html>
